<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consulta de Matrícula</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #eef1f4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Cabeçalho dividido em duas metades (50% / 50%) */
  .form-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    background: #f8f9fa;
    padding: 10px 8px;
    border-bottom: 1px solid #ddd;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    box-sizing: border-box;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  /* Metade Esquerda: Formulário alinhado ao início */
  .left-section {
    display: flex;
    gap: 15px;
    align-items: center;
    justify-content: flex-start;
    padding-left: 20px;
  }

  /* Metade Direita: Botões Auxiliares Centrados com a Frame Direita */
  .right-section {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
  }

  /* Zona Central Absoluta: Estado do Seguro */
  .center-status-container {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 11;
  }

  .input-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  label {
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
  }

  input {
    padding: 8px;
    font-size: 14px;
    width: 70px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    transition: 0.3s;
    text-transform: uppercase;
  }
  input:focus {
    border-color: #00796b;
    box-shadow: 0 0 4px rgba(0, 121, 107, 0.4);
  }

  /* Botão principal (Consultar) */
  button {
    padding: 8px 14px;
    font-size: 14px;
    font-weight: bold;
    background-color: #3d63af;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap;
  }
  button:hover {
    background-color: #0d1b60;
  }

  /* Botões Auxiliares da Direita */
  .aux-btn {
    background-color: #4e6df2;
  }
  .aux-btn:hover {
    background-color: #0d1b60;
  }

  /* Indicador do Estado do Seguro com Fundo Colorido no Centro */
  .seguro-status-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    padding: 3px 14px;
    min-width: 160px;
    height: 38px;
    box-sizing: border-box;
    transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    border: 1px solid transparent;
  }

  /* Estados de Fundo */
  .seguro-status-container.idle {
    background-color: #e2e8f0;
    border-color: #cbd5e1;
    color: #475569;
  }
  .seguro-status-container.ok {
    background-color: #00aa00; /* Verde Ativo */
    border-color: #15803d;
    color: #ffffff;
  }
  .seguro-status-container.no {
    background-color: #dc2626; /* Vermelho Sem Seguro */
    border-color: #b91c1c;
    color: #ffffff;
  }
  .seguro-status-container.warn {
    background-color: #d97706; /* Laranja/Amarelo Aviso e Aguardar */
    border-color: #b45309;
    color: #ffffff;
  }

  .seguro-badge {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1.1;
    color: inherit;
  }

  .seguro-rate-info {
    font-size: 9px;
    margin-top: 1px;
    white-space: nowrap;
    font-weight: 600;
    opacity: 0.95;
    color: inherit;
  }

  /* Botão Ecrã Inteiro Fixado na Extremidade Direita */
  .fullscreen-btn {
    position: absolute;
    right: 15px;
    background-color: #3d63af;
    padding: 8px 12px;
    border-radius: 6px;
  }
  .fullscreen-btn:hover {
    background-color: #0d1b60;
  }

  /* Área Geral das Metades Inferiores */
  .iframe-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    background: #fafafa;
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;
  }

  /* Contentores individuais para gerir o Spinner por trás da Iframe */
  .iframe-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    background: #f1f3f4;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ccc;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: white;
    position: relative;
    z-index: 2;
  }

  /* Estilo do Spinner / Carregamento de Performance */
  .loading-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #f8f9fa;
    color: #5f6368;
    font-size: 14px;
    font-weight: bold;
    z-index: 1;
  }

  .spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #00796b;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Toast de Notificação de Cópia */
  .toast-notification {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background-color: #323232;
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    z-index: 99999;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateY(100px);
    transition: transform 0.3s ease, opacity 0.3s ease;
    pointer-events: none;
  }
  .toast-notification.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* Responsividade para ecrãs pequenos */
  @media (max-width: 1200px) {
    .form-container {
      display: flex;
      flex-direction: column;
      text-align: center;
      gap: 15px;
      padding: 15px;
    }
    .left-section, .right-section {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
      width: 100%;
    }
    .center-status-container {
      position: static;
      transform: none;
      margin: 5px 0;
    }
    .fullscreen-btn {
      position: static;
    }
    .iframe-container {
      grid-template-columns: 1fr;
      top: 230px;
    }
  }

  /* Modal styles */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 10000;
  }
  .modal-overlay.active {
    visibility: visible;
    opacity: 1;
  }
  .modal-content {
    background: white;
    padding: 25px 30px 5px 30px;
    border-radius: 8px;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    box-sizing: border-box;
  }
  .modal-content h2 {
    font-family: 'Georgia', serif;
    color: #3d63af;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 12px 0;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .modal-content p {
    font-family: 'Arial', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.8;
    margin: 0 0 10px 0;
    font-style: italic;
    text-align: justify;
  }
  .modal-content button {
    padding: 8px 18px;
    background-color: #3d63af;
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  .modal-content button:hover {
    background-color: #0d1b60;
  }
  .modal-buttons {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 20px;
  }
  
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 15px;
    margin-bottom: 0px;
    border-top: 1px solid #f1f1f1;
    padding-top: 10px;
    width: 100%;
  }

  .popup-name {
    font-weight: bold !important;
    font-size: 12px !important;
    color: #8e8a96;
    margin: 0 !important;
    text-align: right;
    line-height: 1.2;
    font-family: Arial, sans-serif;
    letter-spacing: 0.8px;
  }
</style>
<script>
  let ultimaMatriculaPesquisada = "";

  // =========================================================================
  // CONFIGURAÇÕES E CONSTANTES CONFIGURÁVEIS (ASF)
  // =========================================================================
  const ASF_TIMEOUT_MS = 12000;          // Timeout da requisição
  const ASF_MIN_INTERVAL_MS = 8000;      // Intervalo mínimo entre requisições
  const ASF_JANELA_SEG = 63;             // Janela de sliding window
  const ASF_LIMITE_JANELA = 5;           // Máximo requisições na janela
  const ASF_CACHE_TTL_MS = 600000;       // Cache 10 minutos (600.000ms)
  const ASF_MAX_RETRIES = 3;             // Máximo retries
  const ASF_BACKOFF_BASE_MS = 1000;      // Base backoff exponencial (1s, 2s, 4s)

  // =========================================================================
  // ESTADO DA APLICAÇÃO E RASTREAMENTO
  // =========================================================================
  const cacheConsultas = new Map();
  const tentativasConsulta = new Map();  // Rastreamento de retries por matrícula
  let historicoPedidos = [];
  let ultimoPedidoT = 0;
  let filaPromessas = Promise.resolve();
  let seguroEmProcessamento = false;     // Flag para evitar novos pedidos de seguro enquanto decorre um

  function formatMatricula(input) {
    let value = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    let formattedValue = value.replace(/(.{2})(.{2})?(.*)/, (_, p1, p2, p3) =>
      [p1, p2, p3].filter(Boolean).join('-')
    );
    input.value = formattedValue.substring(0, 8);
  }

  function formatMatriculaReboque(input) {
    const siglas = [
      'A', 'AN', 'AV', 'BE', 'BG', 'BR', 'C', 'CB', 'E', 'FA',
      'GD', 'H', 'L', 'LE', 'M', 'P', 'PT', 'SA', 'SE', 'VC', 'VI', 'VR'
    ];
    
    let value = input.value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
    let matchLetras = value.match(/^([A-Z]+)/);
    
    if (matchLetras) {
      let letrasDigitadas = matchLetras[1];
      let prefixoValido = siglas.some(sigla => sigla.startsWith(letrasDigitadas));
      
      if (!prefixoValido) {
        value = value.substring(0, value.length - 1);
        matchLetras = value.match(/^([A-Z]+)/);
      }
    }
    
    if (matchLetras) {
      let siglaDefinitiva = matchLetras[1];
      
      if (!siglas.includes(siglaDefinitiva)) {
        value = siglaDefinitiva;
      } else {
        let restante = value.substring(siglaDefinitiva.length).replace(/[^0-9]/g, '');
        restante = restante.substring(0, 6);
        
        if (restante.length > 0) {
          value = siglaDefinitiva + '-' + restante;
        } else if (input.value.endsWith('-')) {
          value = siglaDefinitiva + '-';
        } else {
          value = siglaDefinitiva;
        }
      }
    } else {
      value = '';
    }
    
    input.value = value;
  }

  function mostrarLoading(frameId, overlayId) {
    document.getElementById(overlayId).style.display = 'flex';
    document.getElementById(frameId).style.zIndex = '1';
  }

  function occultarLoading(frameId, overlayId) {
    document.getElementById(overlayId).style.display = 'none';
    document.getElementById(frameId).style.zIndex = '2';
  }

  function submitConjunto(event) {
    if (event) event.preventDefault();
    
    const inputVeiculo = document.getElementById('MatriculaVeiculo');
    const inputReboque = document.getElementById('MatriculaReboque');
    
    const valVeiculo = inputVeiculo.value.trim();
    const valReboque = inputReboque.value.trim();

    if (!valVeiculo && !valReboque) {
      alert("Por favor, introduza pelo menos uma matrícula.");
      return;
    }

    // Atualiza sempre as inspeções nas iframes
    if (valVeiculo && valReboque) {
      mostrarLoading('veiculoFrame', 'veiculoLoading');
      mostrarLoading('reboqueFrame', 'reboqueLoading');
      document.getElementById('veiculoFrame').src = `http://consultapsp.imtt.external.rnsi.local/veiculos/consulta_inspecao.php?Matricula=${valVeiculo}`;
      document.getElementById('reboqueFrame').src = `http://consultapsp.imtt.external.rnsi.local/veiculos/consulta_livrete.php?Matricula=${valReboque}`;
      ultimaMatriculaPesquisada = valVeiculo;
    } 
    else if (valVeiculo && !valReboque) {
      mostrarLoading('veiculoFrame', 'veiculoLoading');
      mostrarLoading('reboqueFrame', 'reboqueLoading');
      document.getElementById('veiculoFrame').src = `http://consultapsp.imtt.external.rnsi.local/veiculos/consulta_inspecao.php?Matricula=${valVeiculo}`;
      document.getElementById('reboqueFrame').src = `http://consultapsp.imtt.external.rnsi.local/veiculos/consulta_livrete.php?Matricula=${valVeiculo}`;
      ultimaMatriculaPesquisada = valVeiculo;
    } 
    else if (!valVeiculo && valReboque) {
      mostrarLoading('veiculoFrame', 'veiculoLoading');
      mostrarLoading('reboqueFrame', 'reboqueLoading');
      document.getElementById('veiculoFrame').src = `http://consultapsp.imtt.external.rnsi.local/veiculos/consulta_inspecao.php?Matricula=${valReboque}`;
      document.getElementById('reboqueFrame').src = `http://consultapsp.imtt.external.rnsi.local/veiculos/consulta_livrete.php?Matricula=${valReboque}`;
      ultimaMatriculaPesquisada = valReboque;
    }

    // Consulta do seguro: Apenas se não houver já um pedido de seguro ativo
    const matriculaParaSeguro = valVeiculo || valReboque;
    if (matriculaParaSeguro) {
      solicitarConsultaSeguro(matriculaParaSeguro);
    } else {
      setSeguroState('idle', 'SEGURO: N/A');
    }

    inputVeiculo.value = '';
    inputReboque.value = '';
  }

  // =========================================================================
  // LÓGICA DA CONSULTA DE SEGURO ASF
  // =========================================================================
  function sanitizarMatricula(mat) {
    return String(mat || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  function setSeguroState(stateClass, badgeText) {
    const containerEl = document.getElementById('seguroContainer');
    const badgeEl = document.getElementById('seguroBadge');
    if (containerEl) containerEl.className = `seguro-status-container ${stateClass}`;
    if (badgeEl) badgeEl.textContent = badgeText;
  }

  function calcularAtrasoNecessario() {
    if (ultimoPedidoT === 0) {
      return 0;
    }

    const agora = Date.now();
    historicoPedidos = historicoPedidos.filter(t => (agora - t) < ASF_JANELA_SEG * 1000);
    
    let atraso = 0;

    const decorrido = agora - ultimoPedidoT;
    if (decorrido < ASF_MIN_INTERVAL_MS) {
      atraso = Math.max(atraso, ASF_MIN_INTERVAL_MS - decorrido);
    }

    if (historicoPedidos.length >= ASF_LIMITE_JANELA) {
      const maisAntigo = historicoPedidos[0];
      const esperaJanela = (maisAntigo + (ASF_JANELA_SEG * 1000)) - agora + 200;
      atraso = Math.max(atraso, esperaJanela);
    }

    return Math.max(0, Math.ceil(atraso));
  }

  function atualizarWidgetStatus() {
    const atraso = calcularAtrasoNecessario();
    const statusEl = document.getElementById('rateStatus');
    if (!statusEl) return;

    if (atraso > 0) {
      const segs = Math.ceil(atraso / 1000);
      statusEl.textContent = `Aguarde ${segs}s`;
    } else {
      statusEl.textContent = `Pronto`;
    }
  }
  setInterval(atualizarWidgetStatus, 500);

  function solicitarConsultaSeguro(matDisplay) {
    const matLimpa = sanitizarMatricula(matDisplay);
    if (!matLimpa) return;

    // Verificação de Cache (10 minutos)
    const emCache = cacheConsultas.get(matLimpa);
    if (emCache && (Date.now() - emCache.timestamp) < ASF_CACHE_TTL_MS) {
      exibirResultadoSeguro(emCache.temSeguro, true);
      return;
    }

    // Se já estiver uma consulta de seguro em curso, ignora novos pedidos de seguro
    if (seguroEmProcessamento) {
      console.log(`[ASF] Consulta de seguro para ${matLimpa} ignorada: já existe um pedido em processamento.`);
      return;
    }

    // Reset ao contador de tentativas para esta matrícula
    tentativasConsulta.set(matLimpa, 0);
    seguroEmProcessamento = true;

    filaPromessas = filaPromessas.then(async () => {
      try {
        await processarConsultaSeguroComCadencia(matLimpa);
      } finally {
        seguroEmProcessamento = false;
      }
    }).catch(() => {
      seguroEmProcessamento = false;
    });
  }

  // Executa a requisição física HTTP/XHR com timeout
  async function efetuarPedidoHttpASF(url) {
    if (typeof ActiveXObject !== 'undefined') {
      const xhr = new ActiveXObject("WinHttp.WinHttpRequest.5.1");
      xhr.open("POST", url, false);
      xhr.setTimeouts(10000, 10000, ASF_TIMEOUT_MS, ASF_TIMEOUT_MS);
      xhr.setRequestHeader("Accept", "application/json, text/plain, */*");
      xhr.send(null);
      return { status: xhr.Status, text: xhr.ResponseText };
    } else {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), ASF_TIMEOUT_MS);

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Accept': 'application/json, text/plain, */*' },
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      const text = await res.text();
      return { status: res.status, text: text };
    }
  }

  // Função isolada: Trata exclusivamente a requisição HTTP e a validação do status
  async function realizarConsultaASF(matLimpa) {
    const hoje = new Date();
    const yyyy = hoje.getFullYear();
    const mm = String(hoje.getMonth() + 1).padStart(2, '0');
    const dd = String(hoje.getDate()).padStart(2, '0');
    const dataHoje = `${yyyy}/${mm}/${dd}`;

    const queryGQL = `mutation license { mobishoutEntry { noone { entry { licenseNumber(license: "${matLimpa}", date: "${dataHoje}") { nodes { id license } } } } } }`;
    const url = `https://ext01.asf.com.pt/api/src/?query=${encodeURIComponent(queryGQL)}`;

    const resposta = await efetuarPedidoHttpASF(url);
    const httpStatus = resposta.status;
    const responseText = resposta.text;

    if (httpStatus === 429) {
      throw new Error("Servidor ASF bloqueado por rate limit (HTTP 429)");
    }
    if (httpStatus === 403) {
      throw new Error("Acesso proibido ao servidor ASF (HTTP 403)");
    }
    if (httpStatus < 200 || httpStatus >= 300) {
      throw new Error(`Erro HTTP ${httpStatus}`);
    }

    const json = JSON.parse(responseText);
    const mobishoutEntry = json?.data?.mobishoutEntry;

    if (mobishoutEntry) {
      const licenseNode = mobishoutEntry?.noone?.entry?.licenseNumber;
      let temSeguro = false;
      if (licenseNode && Array.isArray(licenseNode.nodes) && licenseNode.nodes.length > 0) {
        temSeguro = licenseNode.nodes.some(n => n && n.license != null);
      }
      return temSeguro;
    } else {
      throw new Error("Resposta inválida ou vazia do servidor ASF");
    }
  }

  // Função orquestradora: Gere o loop de retry com backoff exponencial e controlo de cadência
  async function processarConsultaSeguroComCadencia(matLimpa) {
    let tentativa = tentativasConsulta.get(matLimpa) || 0;
    let ultimoErro = null;

    while (tentativa <= ASF_MAX_RETRIES) {
      let atraso = calcularAtrasoNecessario();
      while (atraso > 0) {
        setSeguroState('warn', 'A AGUARDAR');
        await new Promise(r => setTimeout(r, Math.min(atraso, 1000)));
        atraso = calcularAtrasoNecessario();
      }

      if (tentativa === 0) {
        setSeguroState('warn', 'A VERIFICAR...');
      } else {
        setSeguroState('warn', `RETRY ${tentativa}/${ASF_MAX_RETRIES}`);
        console.log(`[ASF] Tentativa ${tentativa}/${ASF_MAX_RETRIES} para a matrícula ${matLimpa}`);
      }

      const agora = Date.now();
      ultimoPedidoT = agora;
      historicoPedidos.push(agora);
      atualizarWidgetStatus();

      try {
        const temSeguro = await realizarConsultaASF(matLimpa);
        cacheConsultas.set(matLimpa, { timestamp: Date.now(), temSeguro });
        exibirResultadoSeguro(temSeguro, false);
        return; // Sucesso na consulta
      } catch (err) {
        ultimoErro = err;
        console.warn(`[ASF] Falha na tentativa ${tentativa} (${matLimpa}):`, err.message);
        tentativa++;
        tentativasConsulta.set(matLimpa, tentativa);

        if (tentativa <= ASF_MAX_RETRIES) {
          // Backoff exponencial: 1s, 2s, 4s...
          const atrasoBackoff = ASF_BACKOFF_BASE_MS * Math.pow(2, tentativa - 1);
          await new Promise(r => setTimeout(r, atrasoBackoff));
        }
      }
    }

    // Esgotaram-se todas as tentativas
    console.error(`[ASF] Todas as ${ASF_MAX_RETRIES} tentativas falharam para ${matLimpa}:`, ultimoErro);
    setSeguroState('warn', 'INDISPONÍVEL');
  }

  function exibirResultadoSeguro(temSeguro, deCache) {
    const sufixo = deCache ? ' (c)' : '';
    if (temSeguro) {
      setSeguroState('ok', 'SEGURO ATIVO' + sufixo);
    } else {
      setSeguroState('no', 'SEM SEGURO' + sufixo);
    }
  }

  function obterMatriculaOuVazia() {
    return ultimaMatriculaPesquisada || "";
  }

  function copiarEVisualizar(texto) {
    if (!texto) return;
    navigator.clipboard.writeText(texto).then(() => {
      const toast = document.getElementById('toastNotification');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }).catch(err => {
      console.log('Erro ao copiar matrícula: ', err);
    });
  }

  function consultarIMTERRU() {
    const mat = obterMatriculaOuVazia();
    copiarEVisualizar(mat);
    const url = `https://erru.imt-ip.pt/ERRU/`;
    window.open(url, 'IMTERRUPopup', 'width=900,height=700,top=100,left=100,resizable=yes,scrollbars=yes');
  }

  function consultarINEM() {
    const mat = obterMatriculaOuVazia();
    copiarEVisualizar(mat);
    const url = `https://alvaras.inem.pt/DMZ/ConsultaCertificado.aspx`;
    window.open(url, 'INEMPopup', 'width=900,height=700,top=100,left=100,resizable=yes,scrollbars=yes');
  }

  function consultarASF() {
    const mat = obterMatriculaOuVazia();
    copiarEVisualizar(mat);
    const url = `https://www.consumidor.asf.com.pt/servi%C3%A7os/verificar-seguro-atrav%C3%A9s-da-matr%C3%ADcula`;
    window.open(url, 'ASFPopup', 'width=900,height=700,top=100,left=100,resizable=yes,scrollbars=yes');
  }

  function consultarWAZE() {
    const url = `https://location.wazept.com/#/`;
    window.open(url, 'WazePopup', 'width=900,height=700,top=100,left=100,resizable=yes,scrollbars=yes');
  }

  function toggleFullscreen() {
    const doc = document.documentElement;
    if (!document.fullscreenElement) {
      doc.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  function showModal() {
    document.getElementById('popupModal').classList.add('active');
  }
  function closeModal() {
    document.getElementById('popupModal').classList.remove('active');
  }

  window.addEventListener('load', () => { showModal(); });
  window.addEventListener('click', (e) => { if (e.target === document.getElementById('popupModal')) closeModal(); });
</script>
</head>
<body>
  <div id="toastNotification" class="toast-notification">Matrícula copiada!</div>

  <div id="popupModal" class="modal-overlay">
    <div class="modal-content">
      <h2>Bem-vindo!</h2>
      <p>Caro(a) utilizador(a), a aplicação encontra-se disponível exclusivamente através da intranet.</p>
      <div class="modal-buttons">
        <button onclick="closeModal()">FECHAR</button>
      </div>
      <div class="modal-footer">
        <p class="popup-name">Fábio Moço · GP2150375</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    
    <!-- Esquerda: Formulário -->
    <div class="left-section">
      <form onsubmit="submitConjunto(event)" style="display: flex; gap: 15px; align-items: center;">
        <div class="input-group">
          <label for="MatriculaVeiculo">Veículo:</label>
          <input type="text" id="MatriculaVeiculo" placeholder="11-AA-11" maxlength="8" oninput="formatMatricula(this)">
        </div>

        <div class="input-group">
          <label for="MatriculaReboque">Reboque:</label>
          <input type="text" id="MatriculaReboque" placeholder="L-121212" oninput="formatMatriculaReboque(this)">
        </div>

        <button type="submit" id="btnSubmit">CONSULTAR</button>
      </form>
    </div>

    <!-- Centro Absoluto: Indicador do Estado do Seguro -->
    <div class="center-status-container">
      <div id="seguroContainer" class="seguro-status-container idle">
        <div id="seguroBadge" class="seguro-badge">SEGURO: —</div>
        <div id="rateStatus" class="seguro-rate-info">Pronto</div>
      </div>
    </div>

    <!-- Direita: Botões Auxiliares -->
    <div class="right-section">
      <button type="button" class="aux-btn" onclick="consultarIMTERRU()">IMT-ERRU</button>
      <button type="button" class="aux-btn" onclick="consultarINEM()">INEM</button>
      <button type="button" class="aux-btn" onclick="consultarASF()">ASF</button>
      <button type="button" class="aux-btn" onclick="consultarWAZE()">WAZE</button>
      <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Ecrã Inteiro">⛶</button>
    </div>

  </div>

  <div class="iframe-container">
    <div class="iframe-wrapper">
      <div id="veiculoLoading" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        A carregar inspeção...
      </div>
      <iframe id="veiculoFrame" loading="lazy" onload="occultarLoading('veiculoFrame', 'veiculoLoading')"></iframe>
    </div>

    <div class="iframe-wrapper">
      <div id="reboqueLoading" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        A carregar livrete...
      </div>
      <iframe id="reboqueFrame" loading="lazy" onload="occultarLoading('reboqueFrame', 'reboqueLoading')"></iframe>
    </div>
  </div>
</body>
</html>
